# Jalankan dari folder deploy/:  docker compose up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROXY_TOKEN: ${PROXY_TOKEN:?isi PROXY_TOKEN di deploy/.env}
        LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
        LLM_PATH: ${LLM_PATH:-/v1beta/openai/chat/completions}
        LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
        FALLBACK_MODEL: ${FALLBACK_MODEL:-}
        FALLBACK_PATH: ${FALLBACK_PATH:-/openai/v1/chat/completions}
        FALLBACK_REASONING_EFFORT: ${FALLBACK_REASONING_EFFORT:-low}
        MAX_TOKENS: ${MAX_TOKENS:-1024}
        HEDGE_MS: ${HEDGE_MS:-1500}
        VIDEO_AVATAR_URL: ${VIDEO_AVATAR_URL:-}
        VIDEO_AVATAR_ENABLED: ${VIDEO_AVATAR_ENABLED:-}
        VIDEO_AVATAR_IDLE_URL: ${VIDEO_AVATAR_IDLE_URL:-/avatar/nara_idle.mp4}
        VIDEO_AVATAR_VOICE: ${VIDEO_AVATAR_VOICE:-id-ID-GadisNeural}
        TTS_BACKEND: ${TTS_BACKEND:-edge_tts}
        STT_BACKEND: ${STT_BACKEND:-browser_speech}
        WHISPER_MODEL: ${WHISPER_MODEL:-whisper-large-v3-turbo}
        VRM_URL: ${VRM_URL:-/avatar/model.glb}
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PUBLISH:-80}:80"
      - "${HTTPS_PUBLISH:-443}:443"
      - "${HTTPS_PUBLISH:-443}:443/udp"
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
